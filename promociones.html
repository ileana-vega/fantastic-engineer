<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#01257D">
    <title>Promociones CEITSA</title>

    <style>
        :root {
            --azul: #01257D;
            --amarillo: #FFCD00;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            min-height: -webkit-fill-available;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', Arial, sans-serif;
            background: radial-gradient(
                circle at center,
                rgba(217, 217, 217, 0.16) 0%,
                rgba(1, 37, 125, 0.96) 48%,
                var(--azul) 85%
            );
            -webkit-tap-highlight-color: transparent;
        }

        button,
        a {
            font: inherit;
        }

        .page-shell {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 600px;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(
                circle at center,
                rgba(217, 217, 217, 0.16) 0%,
                rgba(1, 37, 125, 0.96) 48%,
                var(--azul) 85%
            );
        }

        .logo-empresa {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            width: 350px;
            max-width: 27vw;
            height: auto;
            z-index: 10;
        }

        .logo-marca {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            width: 140px;
            height: 140px;
            z-index: 10;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        header {
            position: absolute;
            top: 20px;
            left: 17%;
            right: 17%;
            z-index: 6;
            padding-bottom: 10px;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--amarillo);
            font-size: clamp(32px, 3vw, 45px);
            font-weight: 700;
            line-height: 1.08;
        }

        h2 {
            margin: 5px 0 0;
            color: white;
            font-size: clamp(15px, 1.25vw, 18px);
            font-weight: 500;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .producto-img {
            position: absolute;
            top: 48%;
            left: 50%;
            z-index: 3;
            width: var(--product-width, 34%);
            max-width: none;
            max-height: 64vh;
            height: auto;
            transform: translate(-50%, -50%) scale(var(--product-scale, 1));
            object-fit: contain;
            image-rendering: auto;
        }

        .nav-bar {
            position: absolute;
            top: 35%;
            left: 5%;
            right: 5%;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            padding: 0 50px;
        }

        .grupo-nav {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .punto {
            display: block;
            flex: 0 0 auto;
            width: 25px;
            height: 25px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .punto:hover,
        .punto:focus-visible,
        .punto.activo {
            transform: scale(1.2);
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.16);
            outline: none;
        }


        /* Indicación inicial para descubrir la información de los círculos */
        .circle-hint {
            position: absolute;
            top: calc(35% + 54px);
            left: 50%;
            z-index: 9;
            display: flex;
            align-items: center;
            gap: 10px;
            width: max-content;
            max-width: min(520px, calc(100% - 120px));
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 16px;
            color: white;
            background: rgba(1, 37, 125, 0.82);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            text-align: left;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .circle-hint.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 0);
        }

        .circle-hint-dot {
            flex: 0 0 auto;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 205, 0, 0.16);
        }

        .circle-hint-close {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 2px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            color: white;
            background: rgba(255, 255, 255, 0.12);
            font-size: 19px;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .circle-hint-close:hover,
        .circle-hint-close:focus-visible {
            background: rgba(255, 255, 255, 0.23);
            outline: 2px solid var(--amarillo);
            outline-offset: 2px;
            transform: scale(1.06);
        }

        .nav-bar.hint-active .punto {
            animation: punto-resplandor 1.65s ease-in-out 3;
            animation-delay: var(--hint-delay, 0s);
        }

        @keyframes punto-resplandor {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 205, 0, 0);
            }
            50% {
                transform: scale(1.08);
                box-shadow:
                    0 0 0 6px rgba(255, 205, 0, 0.13),
                    0 0 16px rgba(255, 205, 0, 0.3);
            }
        }

        #svg-linea {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            overflow: visible;
            pointer-events: none;
        }

        .linea-animada {
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            filter: drop-shadow(0 0 5px white);
            animation: recorrer 0.6s ease-out forwards;
        }

        @keyframes recorrer {
            from { stroke-dashoffset: 2000; }
            to { stroke-dashoffset: 0; }
        }

        .bottom-area {
            display: contents;
        }

        .action-row {
            display: contents;
        }

        .info-container {
            position: absolute;
            bottom: 100px;
            left: 30px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 400px;
            min-height: 120px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .btn-compra {
            position: absolute;
            bottom: 40px;
            left: 50%;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 50px;
            border: none;
            border-radius: 50px;
            color: black;
            background: var(--amarillo);
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
            transform: translateX(-50%);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn-compra:hover,
        .btn-compra:focus-visible {
            filter: brightness(1.06);
            outline: none;
            transform: translateX(-50%) scale(1.03);
        }

        .descuento {
            position: absolute;
            right: max(42px, calc(env(safe-area-inset-right) + 24px));
            bottom: max(34px, calc(env(safe-area-inset-bottom) + 22px));
            z-index: 5;
            color: white;
            text-align: center;
        }

        .desc-num {
            font-size: clamp(112px, 10.5vw, 165px);
            font-weight: 800;
            line-height: 0.8;
        }

        .desc-text {
            font-size: clamp(31px, 2.9vw, 43px);
            font-weight: 800;
        }

        .arrow-container {
            position: absolute;
            top: 50%;
            z-index: 7;
            width: 50px;
            height: 50px;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            touch-action: manipulation;
            transform: translateY(-50%);
        }

        .arrow-container.left {
            left: max(20px, env(safe-area-inset-left));
            transform: translateY(-50%) scaleX(-1);
        }

        .arrow-container.right {
            right: max(20px, env(safe-area-inset-right));
        }

        .arrow {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            transition: background-color 0.2s ease;
        }

        .arrow.back {
            left: 0;
            z-index: 1;
        }

        .arrow.front {
            left: 10px;
            z-index: 2;
        }

        .arrow-container:hover .arrow,
        .arrow-container:focus-visible .arrow {
            background: rgba(255, 255, 255, 0.35);
        }

        .arrow-container:focus-visible {
            border-radius: 8px;
            outline: 2px solid var(--amarillo);
            outline-offset: 4px;
        }

        /* Tabletas y pantallas medianas */
        @media (max-width: 1100px) and (min-width: 769px) {
            .page-shell {
                min-height: 620px;
            }

            .logo-empresa {
                width: 240px;
            }

            .logo-marca {
                width: 105px;
                height: 105px;
            }

            header {
                left: 20%;
                right: 20%;
            }

            h1 {
                font-size: clamp(30px, 4vw, 40px);
            }

            .producto-img {
                width: var(--product-tablet-width, 46vw);
                max-width: none;
                transform: translate(-50%, -50%) scale(var(--product-tablet-scale, var(--product-scale, 1)));
                max-height: 58vh;
            }

            .nav-bar {
                left: 4%;
                right: 4%;
                padding: 0 32px;
            }

            .grupo-nav {
                gap: 25px;
            }

            .circle-hint {
                top: calc(35% + 50px);
                max-width: min(470px, calc(100% - 90px));
                font-size: 14px;
            }

            .info-container {
                bottom: 80px;
                left: 20px;
                width: 340px;
                min-height: 105px;
                padding: 17px;
                font-size: 21px;
            }

            .btn-compra {
                bottom: 30px;
            }

            .descuento {
                right: max(30px, calc(env(safe-area-inset-right) + 18px));
                bottom: max(26px, calc(env(safe-area-inset-bottom) + 16px));
            }

            .desc-num {
                font-size: 122px;
            }

            .desc-text {
                font-size: 35px;
            }
        }

        /* Celulares en orientación vertical */
        @media (max-width: 768px) and (orientation: portrait) {
            body {
                overflow-x: hidden;
                overflow-y: auto;
            }

            .page-shell {
                height: 100vh;
                height: -webkit-fill-available;
                height: 100dvh;
                min-height: 680px;
                overflow: hidden;
            }

            .logo-empresa {
                top: max(12px, env(safe-area-inset-top));
                left: max(12px, env(safe-area-inset-left));
                width: 120px;
                max-width: 38vw;
            }

            .logo-marca {
                top: max(12px, env(safe-area-inset-top));
                right: max(12px, env(safe-area-inset-right));
                width: 72px;
                height: 72px;
                border-radius: 8px;
            }

            header {
                top: 94px;
                left: 14px;
                right: 14px;
                padding: 0;
            }

            h1 {
                font-size: clamp(25px, 7.4vw, 31px);
                line-height: 1.05;
            }

            h2 {
                margin-top: 6px;
                font-size: clamp(12px, 3.7vw, 15px);
            }

            .nav-bar {
                top: 178px;
                left: 16px;
                right: 16px;
                gap: 20px;
                padding: 0;
            }

            .grupo-nav {
                gap: clamp(10px, 3.5vw, 16px);
            }

            .punto {
                width: 20px;
                height: 20px;
            }

            .circle-hint {
                top: 214px;
                width: calc(100% - 48px);
                max-width: 430px;
                padding: 10px 12px;
                border-radius: 14px;
                font-size: 13px;
            }

            .circle-hint-dot {
                width: 12px;
                height: 12px;
            }

            .circle-hint-close {
                width: 24px;
                height: 24px;
                font-size: 18px;
            }

            .producto-img {
                top: 43%;
                width: var(--product-mobile-width, 76vw);
                max-width: none;
                transform: translate(-50%, -50%) scale(var(--product-mobile-scale, var(--product-scale, 1)));
                max-height: 42vh;
            }

            .arrow-container {
                top: 43%;
                width: 42px;
                height: 46px;
            }

            .arrow-container.left {
                left: max(8px, env(safe-area-inset-left));
            }

            .arrow-container.right {
                right: max(8px, env(safe-area-inset-right));
            }

            .arrow {
                width: 29px;
                height: 34px;
            }

            .arrow.front {
                left: 8px;
            }

            .bottom-area {
                position: absolute;
                right: max(18px, calc(env(safe-area-inset-right) + 10px));
                bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
                left: max(18px, calc(env(safe-area-inset-left) + 10px));
                z-index: 6;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .action-row {
                position: relative;
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                min-height: 72px;
            }

            .info-container {
                position: relative;
                inset: auto;
                width: 100%;
                min-height: 88px;
                max-height: 128px;
                padding: 14px 16px;
                border-radius: 16px;
                font-size: 18px;
                line-height: 1.25;
                overflow-x: hidden;
                overflow-y: auto;
                scrollbar-width: thin;
            }

            .btn-compra {
                position: relative;
                inset: auto;
                min-width: 150px;
                min-height: 46px;
                padding: 10px 24px;
                font-size: 17px;
                transform: none;
            }

            .btn-compra:hover,
            .btn-compra:focus-visible {
                transform: scale(1.03);
            }

            .descuento {
                right: 6px;
                bottom: 6px;
            }

            .desc-num {
                font-size: clamp(88px, 25vw, 112px);
            }

            .desc-text {
                font-size: clamp(24px, 7.2vw, 33px);
            }

            .linea-animada {
                stroke-width: 2.5;
                animation-duration: 0.35s;
            }
        }

        /* Celulares y tabletas en horizontal o pantallas con poca altura */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                overflow-x: hidden;
                overflow-y: auto;
            }

            .page-shell {
                min-height: 360px;
            }

            .logo-empresa {
                top: 8px;
                left: 12px;
                width: 160px;
                max-width: 23vw;
            }

            .logo-marca {
                top: 8px;
                right: 12px;
                width: 62px;
                height: 62px;
            }

            header {
                top: 8px;
                left: 22%;
                right: 22%;
            }

            h1 {
                font-size: clamp(23px, 3.5vw, 28px);
            }

            h2 {
                font-size: 12px;
            }

            .nav-bar {
                top: 30%;
                left: 5%;
                right: 5%;
                padding: 0 20px;
            }

            .grupo-nav {
                gap: clamp(12px, 2.5vw, 20px);
            }

            .punto {
                width: 18px;
                height: 18px;
            }

            .circle-hint {
                top: calc(30% + 36px);
                max-width: min(430px, calc(100% - 100px));
                padding: 8px 12px;
                font-size: 12px;
            }

            .producto-img {
                top: 47%;
                width: var(--product-landscape-width, 38vw);
                max-width: none;
                transform: translate(-50%, -50%) scale(var(--product-landscape-scale, var(--product-scale, 1)));
                max-height: 60vh;
            }

            .bottom-area {
                position: absolute;
                right: max(20px, calc(env(safe-area-inset-right) + 10px));
                bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px));
                left: max(20px, calc(env(safe-area-inset-left) + 10px));
                z-index: 6;
                display: grid;
                grid-template-columns: minmax(190px, 300px) minmax(220px, 1fr);
                gap: 14px;
                align-items: end;
            }

            .info-container {
                position: relative;
                inset: auto;
                grid-row: 1;
                grid-column: 1;
                width: 100%;
                min-height: 70px;
                max-height: 82px;
                padding: 10px 13px;
                border-radius: 14px;
                font-size: 16px;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .action-row {
                position: relative;
                display: flex;
                grid-row: 1;
                grid-column: 2;
                align-items: flex-end;
                justify-content: flex-start;
                min-height: 70px;
            }

            .btn-compra {
                position: relative;
                inset: auto;
                min-width: 128px;
                min-height: 41px;
                padding: 8px 24px;
                font-size: 15px;
                transform: none;
            }

            .btn-compra:hover,
            .btn-compra:focus-visible {
                transform: scale(1.03);
            }

            .descuento {
                right: 8px;
                bottom: 5px;
            }

            .desc-num {
                font-size: 86px;
            }

            .desc-text {
                font-size: 26px;
            }

            .arrow-container {
                top: 47%;
                width: 40px;
                height: 40px;
            }

            .arrow-container.left {
                left: 10px;
            }

            .arrow-container.right {
                right: 10px;
            }

            .arrow {
                width: 27px;
                height: 29px;
            }
        }

        /* Optimización de renderizado para celulares y dispositivos táctiles */
        @media (hover: none) and (pointer: coarse) {
            .info-container,
            .arrow,
            .circle-hint {
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
            }

            .info-container {
                background: rgba(255, 255, 255, 0.14);
            }

            .arrow {
                background: rgba(255, 255, 255, 0.24);
            }

            .linea-animada {
                filter: none;
            }

            .punto,
            .arrow,
            .btn-compra {
                transition-duration: 0.12s;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell" id="page-shell">

        let cur = 0;

        function render() {
            const producto = data[cur];

            titulo.textContent = producto.t;
            subtitulo.textContent = producto.s;
            productoImg.src = producto.img;
            productoImg.alt = `${producto.t} ${producto.s}`;
            productoImg.style.top = producto.top || '48%';
            productoImg.style.setProperty('--product-width', producto.w);
            productoImg.style.setProperty('--product-tablet-width', producto.tw);
            productoImg.style.setProperty('--product-mobile-width', producto.mw);
            productoImg.style.setProperty('--product-landscape-width', producto.lw);
            productoImg.style.setProperty('--product-scale', producto.sc || '1');
            productoImg.style.setProperty('--product-tablet-scale', producto.tsc || producto.sc || '1');
            productoImg.style.setProperty('--product-mobile-scale', producto.msc || producto.sc || '1');
            productoImg.style.setProperty('--product-landscape-scale', producto.lsc || producto.sc || '1');
            logoMarca.style.backgroundImage = `url("${producto.lm}")`;
            logoMarca.setAttribute('aria-label', `Marca de ${producto.t}`);
            linkCompra.href = producto.lnk;
            descuento.textContent = producto.d;

            navBar.replaceChildren();
            const mitad = Math.ceil(producto.pts.length / 2);
            const grupos = [
                producto.pts.slice(0, mitad),
                producto.pts.slice(mitad)
            ];

            grupos.forEach((puntos, indiceGrupo) => {
                const grupo = document.createElement('div');
                grupo.className = 'grupo-nav';

                puntos.forEach((texto, indiceLocal) => {
                    const indiceReal = indiceGrupo === 0 ? indiceLocal : mitad + indiceLocal;
                    const tipo = indiceReal % 2 === 0 ? 'L' : 'S';
                    const punto = document.createElement('button');

                    punto.type = 'button';
                    punto.className = 'punto';
                    punto.setAttribute('aria-label', texto);
                    punto.dataset.tipo = tipo;
                    punto.dataset.texto = texto;
                    punto.style.setProperty('--hint-delay', `${indiceReal * 0.12}s`);
                    punto.addEventListener('click', () => conectar(punto, tipo, texto));
                    grupo.appendChild(punto);
                });

                navBar.appendChild(grupo);
            });

            limpiarSeleccion();
        }

        function dibujarLinea(el, tipo) {
            const puntoRect = el.getBoundingClientRect();
            const infoRect = infoBox.getBoundingClientRect();
            const shellRect = pageShell.getBoundingClientRect();

            const x1 = puntoRect.left + puntoRect.width / 2 - shellRect.left;
            const y1 = puntoRect.top + puntoRect.height / 2 - shellRect.top;
            const x2 = infoRect.left + infoRect.width / 2 - shellRect.left;
            const y2 = infoRect.top - shellRect.top;

            pathLinea.classList.remove('linea-animada');
            void pathLinea.getBoundingClientRect();

            const trazado = tipo === 'L'
                ? `M ${x1} ${y1} L ${x1} ${y2} L ${x2} ${y2}`
                : `M ${x1} ${y1} C ${x1} ${y2}, ${x2} ${y1}, ${x2} ${y2}`;

            pathLinea.setAttribute('d', trazado);
            pathLinea.classList.add('linea-animada');
        }

        function programarIndicacionCirculos(retraso = 2000) {
            window.clearTimeout(hintShowTimer);
            window.clearTimeout(hintHideTimer);

            circleHint.classList.remove('visible');
            circleHint.setAttribute('aria-hidden', 'true');
            navBar.classList.remove('hint-active');

            hintShowTimer = window.setTimeout(mostrarIndicacionCirculos, retraso);
        }

        function mostrarIndicacionCirculos() {
            window.clearTimeout(hintShowTimer);
            window.clearTimeout(hintHideTimer);

            circleHint.classList.add('visible');
            circleHint.setAttribute('aria-hidden', 'false');

            navBar.classList.remove('hint-active');
            void navBar.getBoundingClientRect();
            navBar.classList.add('hint-active');

            hintHideTimer = window.setTimeout(ocultarIndicacionCirculos, 7500);
        }

        function ocultarIndicacionCirculos() {
            window.clearTimeout(hintShowTimer);
            window.clearTimeout(hintHideTimer);
            circleHint.classList.remove('visible');
            circleHint.setAttribute('aria-hidden', 'true');
            navBar.classList.remove('hint-active');
        }

        function conectar(el, tipo, texto) {
            ocultarIndicacionCirculos();
            document.querySelectorAll('.punto.activo').forEach((punto) => {
                punto.classList.remove('activo');
            });

            el.classList.add('activo');
            puntoActivo = { el, tipo, texto };
            infoBox.textContent = texto;

            if (window.matchMedia('(max-width: 768px)').matches) {
                if (texto.length < 25) infoBox.style.fontSize = '20px';
                else if (texto.length < 55) infoBox.style.fontSize = '18px';
                else infoBox.style.fontSize = '16px';
            } else {
                if (texto.length < 25) infoBox.style.fontSize = '30px';
                else if (texto.length < 50) infoBox.style.fontSize = '26px';
                else infoBox.style.fontSize = '22px';
            }

            requestAnimationFrame(() => dibujarLinea(el, tipo));
        }

        function limpiarSeleccion() {
            puntoActivo = null;
            pathLinea.setAttribute('d', '');
            pathLinea.classList.remove('linea-animada');
            infoBox.textContent = '';
            infoBox.style.fontSize = '';
            document.querySelectorAll('.punto.activo').forEach((punto) => {
                punto.classList.remove('activo');
            });
        }

        function mover(direccion) {
            cur = (cur + direccion + data.length) % data.length;
            render();
            programarIndicacionCirculos(2000);
        }

        function recalcularVista() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!puntoActivo || !document.body.contains(puntoActivo.el)) return;

                const { el, tipo, texto } = puntoActivo;
                infoBox.textContent = texto;
                dibujarLinea(el, tipo);
            }, 120);
        }

        window.addEventListener('resize', recalcularVista, { passive: true });
        window.addEventListener('orientationchange', recalcularVista, { passive: true });
        circleHintClose.addEventListener('click', ocultarIndicacionCirculos);

        render();
        programarIndicacionCirculos(2000);
    </script>
</body>
</html>
